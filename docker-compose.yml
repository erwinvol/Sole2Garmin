services:
  sole2garmin:
    build: .
    image: sole2garmin:latest
    container_name: sole2garmin
    restart: unless-stopped
    environment:
      # SOLE+ / Dyaco Credentials
      - SOLE_EMAIL=your_sole_email@example.com
      - SOLE_PASSWORD=your_sole_password
      - SOLE_BASE_URL=https://api.dyaco.com/v1

      # Garmin Connect Credentials (optional if tokens exist in data/garmin_tokens)
      - GARMIN_USERNAME=your_garmin_email@example.com
      - GARMIN_PASSWORD=your_garmin_password

      # Storage directories inside container
      - DATA_DIR=/data
      - GARMIN_TOKEN_DIR=/data/garmin_tokens
      - SOLE_TOKEN_DIR=/data/sole_tokens
      - SAMPLE_DIR=/data/sample_activities

      # Sync Configuration (Default: 60 minutes)
      - SYNC_INTERVAL_MINUTES=60
      - SYNC_BATCH_SIZE=10
      - CHECK_DUPLICATES=true
      - DUPLICATE_THRESHOLD_HOURS=2

      # FIT Device Spoofing (Garmin Epix Gen 2: 3943; Forerunner 965: 4315; Edge 1040 for bikes: 3927)
      - SPOOF_GARMIN_DEVICE=true
      - DEVICE_PRODUCT_ID=3943
      - DEVICE_SOFTWARE_VERSION=18.16
      - DEFAULT_SPORT=RUNNING
      - DEFAULT_SUB_SPORT=TREADMILL

      # Logging level
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
